# Sets x-a2a-context-id on the ingress gateway for ConsistentHashLB routing.
# Hybrid without Istio httpCookie (oneof): body contextId, client header, or app cookie.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: $NAME-a2a-context-id-extract
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      istio: ingressgateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inlineCode: |
              local META_NAMESPACE = "rasa.a2a"

              local function is_assistant_host(request_handle)
                local authority = request_handle:headers():get(":authority")
                if authority == nil then
                  authority = request_handle:headers():get("host")
                end
                return authority == "assistant.${DOMAIN}"
              end

              local function context_from_cookie(request_handle)
                local cookie = request_handle:headers():get("cookie")
                if cookie == nil then
                  return nil
                end
                return string.match(cookie, "a2a%-context%-id=([^;]+)")
              end

              local function resolve_context_id(request_handle, body_str)
                if body_str ~= nil and body_str ~= "" then
                  local from_body = string.match(body_str, '"contextId"%s*:%s*"([^"\\]+)"')
                  if from_body ~= nil and from_body ~= "" then
                    return from_body
                  end
                end

                local from_client = request_handle:headers():get("X-A2A-Context-Id")
                if from_client ~= nil and from_client ~= "" then
                  return from_client
                end

                return context_from_cookie(request_handle)
              end

              function envoy_on_request(request_handle)
                if not is_assistant_host(request_handle) then
                  return
                end

                local method = request_handle:headers():get(":method")
                if method ~= "POST" then
                  return
                end

                local body_str = nil
                local content_type = request_handle:headers():get("content-type")
                if content_type ~= nil and string.find(content_type, "application/json", 1, true) then
                  local body = request_handle:body(true)
                  if body ~= nil and body:length() > 0 then
                    body_str = body:getBytes(0, body:length())
                  end
                end

                local context_id = resolve_context_id(request_handle, body_str)
                if context_id == nil or context_id == "" then
                  return
                end

                request_handle:headers():replace("x-a2a-context-id", context_id)
                request_handle:streamInfo():dynamicMetadata():set(
                  META_NAMESPACE, "request.info", { context_id = context_id }
                )
              end

              function envoy_on_response(response_handle)
                if not is_assistant_host(response_handle) then
                  return
                end

                local meta = response_handle:streamInfo():dynamicMetadata():get(META_NAMESPACE)
                local context_id = nil
                if meta ~= nil and meta["request.info"] ~= nil then
                  context_id = meta["request.info"]["context_id"]
                end
                if context_id == nil or context_id == "" then
                  return
                end

                response_handle:headers():add(
                  "set-cookie",
                  "a2a-context-id=" .. context_id .. "; Path=/; Max-Age=3600; HttpOnly; SameSite=Lax"
                )
              end
